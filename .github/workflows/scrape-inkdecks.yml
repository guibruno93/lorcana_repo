name: Scrape Inkdecks Decks

# Runners GitHub-hosted são frequentemente bloqueados pelo Cloudflare do Inkdecks.
# O script sai com código 0 nesse caso (local-scraper.js), salvo SCRAPER_CI_STRICT_MIN_DECKS=true.
#
# O job inclui o serviço FlareSolverr (porta 8191); o scraper usa FLARESOLVERR_* quando ativo.
# Alternativas extra: self-hosted runner, PUPPETEER_PROXY_SERVER (secret), cron noutro host.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of decks to scrape'
        required: false
        default: '50'
      runner:
        description: 'Runner label (ubuntu-latest or self-hosted)'
        required: false
        default: 'ubuntu-latest'

jobs:
  scrape:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || vars.SCRAPER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 55

    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
        options: --shm-size=2g

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and Chromium (Puppeteer)
        working-directory: ./backend
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: ''
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Wait for FlareSolverr
        run: |
          echo "À espera de FlareSolverr em 127.0.0.1:8191…"
          for i in $(seq 1 45); do
            if curl -sS --max-time 5 http://127.0.0.1:8191/ >/dev/null 2>&1; then
              echo "FlareSolverr respondeu."
              exit 0
            fi
            sleep 2
          done
          echo "::warning::FlareSolverr não respondeu a tempo; o bypass pode falhar."

      - name: Run Puppeteer scraper
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUPPETEER_HEADLESS: 'true'
          GITHUB_ACTIONS: 'true'
          SCRAPER_SAVE_DEBUG: 'true'
          SCRAPER_MIN_EXPECTED_DECKS: '1'
          PUPPETEER_PROTOCOL_TIMEOUT_MS: '300000'
          PUPPETEER_GOTO_TIMEOUT_MS: '240000'
          PUPPETEER_LISTING_SELECTOR_TIMEOUT_MS: '180000'
          PUPPETEER_PROXY_SERVER: ${{ secrets.PUPPETEER_PROXY_SERVER }}
          FLARESOLVERR_ENABLED: 'true'
          FLARESOLVERR_URL: 'http://127.0.0.1:8191'
          # Cloudflare em CI pode demorar; o fetch ao FlareSolverr deve ser > maxTimeout
          FLARESOLVERR_MAX_TIMEOUT_MS: '180000'
          FLARESOLVERR_CLIENT_TIMEOUT_MS: '300000'
          FLARESOLVERR_WAIT_AFTER: '3'
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          set -e
          LIMIT_VALUE="${LIMIT:-50}"
          echo "🚀 Starting scraper (limit: ${LIMIT_VALUE} decks)..."
          echo "🔥 FlareSolverr env: ENABLED=${FLARESOLVERR_ENABLED:-} URL=${FLARESOLVERR_URL:-}"
          node scripts/local-scraper.js "${LIMIT_VALUE}"

      - name: Check scraping results
        if: always()
        working-directory: ./backend
        run: |
          echo "📊 Scraping step finished. See logs above."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            backend/*.log
            backend/error.png
            backend/log/scrape-debug/**
          retention-days: 7
