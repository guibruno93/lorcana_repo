name: Scrape Inkdecks Decks

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of decks to scrape'
        required: false
        default: '50'
      runner:
        description: 'Runner label (ubuntu-latest or self-hosted)'
        required: false
        default: 'ubuntu-latest'

jobs:
  scrape:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.runner || vars.SCRAPER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies and Chromium (Puppeteer)
        working-directory: ./backend
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: ''
        run: |
          npm ci
          npx puppeteer browsers install chrome

      - name: Run Puppeteer scraper
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUPPETEER_HEADLESS: 'true'
          GITHUB_ACTIONS: 'true'
          SCRAPER_SAVE_DEBUG: 'true'
          SCRAPER_MIN_EXPECTED_DECKS: '1'
          PUPPETEER_PROTOCOL_TIMEOUT_MS: '300000'
          PUPPETEER_GOTO_TIMEOUT_MS: '240000'
          PUPPETEER_LISTING_SELECTOR_TIMEOUT_MS: '180000'
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          LIMIT="${LIMIT:-50}"
          echo "🚀 Starting scraper (limit: $LIMIT decks)..."
          node scripts/local-scraper.js "$LIMIT"

      - name: Check scraping results
        if: always()
        working-directory: ./backend
        run: |
          echo "📊 Scraping step finished. See logs above."

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_number }}
          path: |
            backend/*.log
            backend/error.png
            backend/log/scrape-debug/**
          retention-days: 7
