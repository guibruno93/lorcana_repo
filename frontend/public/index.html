<!-- index.html - HTML atualizado com Meta Tags profissionais -->
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- ═══════════════════════════════════════════════════════════════
         META TAGS - SEO + PWA
         ═══════════════════════════════════════════════════════════════ -->
    
    <!-- Primary Meta Tags -->
    <title>Inkwell Labs — Meta, Deckbuilder e Ferramentas Lorcana TCG</title>
    <meta name="title" content="Inkwell Labs — Meta, Deckbuilder e Ferramentas Lorcana TCG" />
    <meta name="description" content="Domine o meta de Disney Lorcana: análise de torneios em tempo real, tier lists, deckbuilder visual, simulador de mulligan e base de cartas. Grátis para jogadores competitivos." />
    <meta name="keywords" content="Lorcana, Disney Lorcana, TCG, meta, tier list, deck builder, mulligan, Inkdecks, análise de deck, competitive, Inkwell Labs" />
    <meta name="author" content="Inkwell Labs" />
    
    <!-- Theme Color (cyan Inkwell) -->
    <meta name="theme-color" content="#06B6D4" />
    <meta name="msapplication-TileColor" content="#06B6D4" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://inkwelllabs.app/" />
    <meta property="og:title" content="Inkwell Labs — Meta, Deckbuilder e Ferramentas Lorcana TCG" />
    <meta property="og:description" content="Análise de meta em tempo real, deckbuilder, mulligan e base de cartas para Disney Lorcana TCG." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://inkwelllabs.app/" />
    <meta property="twitter:title" content="Inkwell Labs — Meta, Deckbuilder e Ferramentas Lorcana TCG" />
    <meta property="twitter:description" content="Análise de meta em tempo real, deckbuilder, mulligan e base de cartas para Disney Lorcana TCG." />
    <meta property="twitter:image" content="%PUBLIC_URL%/twitter-image.png" />
    
    <!-- Favicon (logo Inkwell Labs) -->
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    
    <!-- Manifest PWA -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Fonts - Optional: Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- ═══════════════════════════════════════════════════════════════
         FAVICON SVG - Inline (Fallback)
         ═══════════════════════════════════════════════════════════════ -->
    
    <style>
      /* Loading Screen */
      #loading-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0f1419 0%, #1a1a2e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      
      #loading-screen .loader {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(102, 126, 234, 0.2);
        border-top-color: #667eea;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  
  <body>
    <noscript>Você precisa habilitar JavaScript para usar Inkwell Labs.</noscript>
    
    <!-- Loading Screen -->
    <div id="loading-screen">
      <div class="loader"></div>
    </div>
    
    <!-- React Root -->
    <div id="root"></div>
    
    <!-- Remove loading screen quando React carregar -->
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          const loader = document.getElementById('loading-screen');
          if (loader) {
            loader.style.opacity = '0';
            loader.style.transition = 'opacity 0.3s ease';
            setTimeout(() => loader.remove(), 300);
          }
        }, 500);
      });
    </script>
  </body>
</html>
