<!-- favicon.svg - Favicon profissional do Inkwell Labs -->
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="32" cy="32" r="32" fill="#0f1419"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="inkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="featherGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f093fb"/>
      <stop offset="100%" stop-color="#f5576c"/>
    </linearGradient>
  </defs>
  
  <!-- Inkwell (Tinteiro) -->
  <path
    d="M20 35 Q20 28 24 24 L40 24 Q44 28 44 35 L44 48 Q44 52 40 52 L24 52 Q20 52 20 48 Z"
    fill="url(#inkGradient)"
  />
  
  <!-- Ink Liquid -->
  <ellipse
    cx="32"
    cy="42"
    rx="10"
    ry="4"
    fill="#4c51bf"
    opacity="0.6"
  />
  
  <!-- Feather (Pena) -->
  <path
    d="M38 30 L48 12 Q49 10 50 12 L52 16 Q53 18 51 19 L40 34 Z"
    fill="url(#featherGradient)"
  />
  
  <!-- Feather Details -->
  <path
    d="M42 22 L44 18 M44 25 L46 21 M46 28 L48 24"
    stroke="#fff"
    stroke-width="1"
    opacity="0.5"
  />
  
  <!-- Shine Effect -->
  <ellipse
    cx="28"
    cy="30"
    rx="4"
    ry="6"
    fill="#fff"
    opacity="0.2"
  />
</svg>
